table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - type:
              _nin:
                - db_write
                - notify
            workflow:
              organization:
                org_members:
                  role:
                    _in:
                      - owner
                      - editor
                  user_id:
                    _eq: X-Hasura-User-Id
          - type:
              _in:
                - db_write
                - notify
            workflow:
              organization:
                org_members:
                  role:
                    _eq: owner
                  user_id:
                    _eq: X-Hasura-User-Id
      columns:
        - workflow_id
        - step_order
        - type
        - config
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - step_order
        - type
        - config
      filter:
        _or:
          - type:
              _nin:
                - db_write
                - notify
            workflow:
              organization:
                org_members:
                  role:
                    _in:
                      - owner
                      - editor
                  user_id:
                    _eq: X-Hasura-User-Id
          - type:
              _in:
                - db_write
                - notify
            workflow:
              organization:
                org_members:
                  role:
                    _eq: owner
                  user_id:
                    _eq: X-Hasura-User-Id
      check: {}
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          organization:
            org_members:
              role:
                _eq: owner
              user_id:
                _eq: X-Hasura-User-Id
