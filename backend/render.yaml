services:
  - type: web
    name: fluxo-backend
    env: python
    plan: free
    buildCommand: "pip install uv && uv sync"
    startCommand: "uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: HASURA_GRAPHQL_ENDPOINT
        sync: false
      - key: HASURA_ADMIN_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_BASE_URL
        sync: false
